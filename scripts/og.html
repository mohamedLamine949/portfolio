<!doctype html>
<!-- Source de public/og.png (1200×630). Régénérer avec Chrome headless :
     chrome --headless=new --window-size=1200,630 --screenshot=public/og.png scripts/og.html -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    background: #12355b; color: #fff; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; justify-content: space-between; padding: 72px 80px; box-sizing: border-box;
    background-image: linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .kicker { font-family: Consolas, monospace; font-size: 22px; color: #d9b06a; letter-spacing: 1px; text-transform: uppercase; }
  h1 { font-size: 78px; margin: 18px 0 10px; letter-spacing: -2px; line-height: 1.05; }
  .role { font-size: 32px; color: #c9d9ec; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: #c9d9ec; border-top: 2px solid #b8893b; padding-top: 26px; }
  .mark { background: #fff; color: #12355b; font-family: Consolas, monospace; font-weight: 700; padding: 10px 14px; border-radius: 8px; font-size: 22px; }
</style>
</head>
<body>
  <div>
    <div class="kicker">Ingénieur informatique · CY Tech 2026</div>
    <h1>Mohamed Lamine Kone</h1>
    <div class="role">Chef de projet digital et consultant en transformation numérique</div>
  </div>
  <div class="foot"><span>mohamedlaminekone.com</span><span class="mark">MLK</span></div>
</body>
</html>
